name: Update AGENTS.md files

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/AGENTS.md"
      - ".github/workflows/**"
      - "uv.lock"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: agents-md-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-agents-md:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        run: |
          # Use the full push range to catch all commits, not just the last one.
          # For workflow_dispatch, fall back to diffing against the previous commit.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD \
            -- . \
            ':(exclude)**/AGENTS.md' \
            ':(exclude).github/workflows/**' \
            ':(exclude)uv.lock')
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No code changes detected, skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            {
              echo 'changed_files<<EOF'
              echo "$CHANGED"
              echo EOF
            } >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            echo "$CHANGED"
          fi

      - name: Trigger Devin session to update AGENTS.md
        if: steps.changes.outputs.skip != 'true'
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          BASE_SHA: ${{ steps.changes.outputs.base }}
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
        run: |
          cat > /tmp/prompt.txt <<'PROMPT'
          You are updating AGENTS.md files in the PrefectHQ/prefect repository after a merge to main.

          Work in the PrefectHQ/prefect repository. The triggering push is the range __BASE__..__SHA__ on main.

          Your session outlives the GitHub Actions job that created it, so newer pushes cannot cancel it. Before doing anything else, run `git fetch origin main` and check whether origin/main has advanced beyond __SHA__. If it has, check out the new head of origin/main instead of __SHA__ and audit the full range __BASE__..HEAD so no newer changes are missed. Otherwise check out __SHA__.

          Then read the skill file at .claude/skills/agents-md-sync/SKILL.md and follow its workflow exactly, using __BASE__..HEAD as the commit range to audit.

          Files changed in the triggering push (more may have landed since — cover them too):
          __CHANGED_FILES__

          Treat AGENTS.md files as rare, durable operating manuals for future agents, not changelogs for the triggering diff.

          Process:
          1. Identify candidate updates before editing.
          2. Apply only high-confidence, minimal edits that document lasting guidance:
             - architectural boundaries
             - non-obvious invariants
             - cross-file contracts
             - recurring failure modes
             - commands or conventions future agents are likely to need
          3. Reject instead of editing when the proposed guidance:
             - documents one helper/function's current control flow
             - restates a docstring, inline comment, test name, or obvious code structure
             - only matters to the triggering PR
             - is niche incident context without a broader editing rule
             - uses broad absolutes like "always" without naming relevant exceptions
          4. Skip edits that are merely reactive, obvious from code, too specific to the triggering diff, file lists, temporary bug context, or notes about every new module.

          Guardrails — your changes must stay small enough to pass all of these:
          - no more than 2 AGENTS.md files changed
          - existing AGENTS.md edits add no more than 10 net lines total
          - new AGENTS.md files are rare: create one only for a real ownership boundary with hidden conventions or pitfalls that are not quick to learn from code, at most 80 lines

          Before opening a PR, self-review your staged changes with a default-to-reject posture: proceed only if every addition is durable, non-obvious, cross-cutting, and not already discoverable from nearby code, comments, docstrings, tests, or existing AGENTS.md content.

          If the update passes review, open a DRAFT pull request against main with the `agents-md` label. The PR title must start with "docs: ", be at most 80 characters, use imperative mood, and describe the substance of the update (e.g. "docs: document new runner layer in server AGENTS.md"), not just a file count. In the PR body, include a <details> section with a justification entry per changed (or new) AGENTS.md file using exactly this structure:
            Path: <AGENTS.md path>
            Proposed text: <brief description or exact text>
            Non-obvious evidence: <why this is not obvious from code/comments/tests/docs>
            Cross-cutting scope: <what subsystem/pattern this applies to beyond one helper>
            Why not code comment/docstring: <why AGENTS.md is the right location>
            Durability: <why this should remain useful after the triggering PR is old>
            Counter-evidence checked: <nearby code/comments/docstrings/tests/AGENTS content checked>
          For each new AGENTS.md file also include "Ownership boundary" and "Hidden conventions" entries. Also include a <details> section listing the files changed in the triggering push.

          If no high-confidence minimal update is needed, or your self-review rejects the update, do not open a PR. Instead, report any recommendations for larger or lower-confidence updates in your final session summary so a human can follow up.

          This workflow runs once per push; your session cannot be cancelled by newer pushes. Re-check `git fetch origin main` before opening the PR — if main advanced again since you started, refresh your analysis against the new head rather than opening a PR for a stale base.
          PROMPT

          # Substitute the push metadata into the prompt (Python handles the
          # multiline changed-file list safely).
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("/tmp/prompt.txt")
          text = p.read_text()
          text = (text
                  .replace("__BASE__", os.environ["BASE_SHA"])
                  .replace("__SHA__", os.environ["GITHUB_SHA"])
                  .replace("__CHANGED_FILES__", os.environ["CHANGED_FILES"]))
          p.write_text(text)
          PY

          payload=$(jq -n --arg prompt "$(cat /tmp/prompt.txt)" '{prompt: $prompt}')

          response=$(curl -s -w "\n%{http_code}" -X POST "https://api.devin.ai/v3/organizations/$DEVIN_ORG_ID/sessions" \
            -H "Authorization: Bearer $DEVIN_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Successfully triggered Devin session"
            session_url=$(echo "$body" | jq -r '.url // empty')
            if [ -n "$session_url" ]; then
              echo "📎 Session URL: $session_url"
              echo "### Devin Session" >> "$GITHUB_STEP_SUMMARY"
              echo "[$session_url]($session_url)" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "❌ Failed to trigger Devin session (HTTP $http_code)"
            echo "Response: $body"
            exit 1
          fi
