name: Fix Flaky Tests with Devin

on:
  workflow_run:
    workflows:
      - "Unit tests"
      - "Integration tests"
      - "UI v2 Checks"
      - "UI v2 E2E Tests"
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  trigger-devin:
    name: Trigger Devin to fix flaky tests
    runs-on: ubuntu-latest
    # Only run when a test workflow fails on this repository's main branch.
    # A pull request from a fork's main branch also has head_branch 'main'.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Trigger Devin session to fix flaky tests
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          prompt="The $WORKFLOW_NAME workflow failed on main. Workflow: $WORKFLOW_URL, Commit: $HEAD_SHA. Investigate and fix the flaky test."

          payload=$(jq -n --arg prompt "$prompt" \
            '{prompt: $prompt, playbook_id: "playbook-8967ef2920e24b9cbd076184b53e170e"}')

          response=$(curl -s -w "\n%{http_code}" -X POST "https://api.devin.ai/v3/organizations/$DEVIN_ORG_ID/sessions" \
            -H "Authorization: Bearer $DEVIN_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Successfully triggered Devin session"
            session_url=$(echo "$body" | jq -r '.url // empty')
            if [ -n "$session_url" ]; then
              echo "📎 Session URL: $session_url"
              echo "### Devin Session" >> "$GITHUB_STEP_SUMMARY"
              echo "[$session_url]($session_url)" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "❌ Failed to trigger session (HTTP $http_code)"
            echo "Response: $body"
            exit 1
          fi
