name: Update docs for code changes

on:
  push:
    branches: [main]
    paths:
      - 'src/prefect/**'
      - 'src/integrations/**'
      - '!**/tests/**'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: docs-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for source code changes
        id: changes
        run: |
          # Use the full push range to catch all commits, not just the last one.
          # For workflow_dispatch, fall back to diffing against the previous commit.
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD \
            -- 'src/prefect/' 'src/integrations/' \
            ':(exclude)**/tests/**' \
            ':(exclude)**/*.md')
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No source code changes detected, skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            {
              echo 'changed_files<<EOF'
              echo "$CHANGED"
              echo EOF
            } >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            echo "$CHANGED"
          fi

      - name: Trigger Devin session to update docs
        if: steps.changes.outputs.skip != 'true'
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          BASE_SHA: ${{ steps.changes.outputs.base }}
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
        run: |
          cat > /tmp/prompt.txt <<'PROMPT'
          You are updating Prefect documentation in the PrefectHQ/prefect repository after a merge to main.

          Work in the PrefectHQ/prefect repository. The triggering push is the range __BASE__..__SHA__ on main. Check out main at __SHA__ and review `git diff __BASE__ __SHA__` for the changed source files.

          Files changed in the triggering push:
          __CHANGED_FILES__

          Read the skill file at .claude/skills/document-changes/SKILL.md and follow its workflow.
          Also read .claude/skills/write-docs/SKILL.md for doc conventions.

          You are in EDIT MODE — apply documentation fixes directly, do not just report them. If none are needed, do nothing.

          For missing coverage that would require new pages, do not create them.
          Instead, include those recommendations in your final session summary under a "Missing coverage recommendations" heading so a human can follow up.

          If you made documentation changes, open a pull request against main. The PR title must:
          - Start with the prefix "docs: "
          - Be at most 80 characters
          - Describe the substance of the update (what API, feature, or behavior the docs now reflect), not just a file count
          - Use imperative mood (e.g. "docs: document new work pool storage CLI flags")

          In the PR body, note that the update was generated by Devin analyzing the diff from the triggering push, include a <details> section listing the changed source files, and include the missing-coverage recommendations if any.
          PROMPT

          # Substitute the push metadata into the prompt (Python handles the
          # multiline changed-file list safely).
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("/tmp/prompt.txt")
          text = p.read_text()
          text = (text
                  .replace("__BASE__", os.environ["BASE_SHA"])
                  .replace("__SHA__", os.environ["GITHUB_SHA"])
                  .replace("__CHANGED_FILES__", os.environ["CHANGED_FILES"]))
          p.write_text(text)
          PY

          payload=$(jq -n --arg prompt "$(cat /tmp/prompt.txt)" '{prompt: $prompt}')

          response=$(curl -s -w "\n%{http_code}" -X POST "https://api.devin.ai/v3/organizations/$DEVIN_ORG_ID/sessions" \
            -H "Authorization: Bearer $DEVIN_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Successfully triggered Devin session"
            session_url=$(echo "$body" | jq -r '.url // empty')
            if [ -n "$session_url" ]; then
              echo "📎 Session URL: $session_url"
              echo "### Devin Session" >> "$GITHUB_STEP_SUMMARY"
              echo "[$session_url]($session_url)" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "❌ Failed to trigger Devin session (HTTP $http_code)"
            echo "Response: $body"
            exit 1
          fi
