name: Prefect AWS MicroVM Docker Test Build

on:
  pull_request:
    paths:
      - "src/integrations/prefect-aws/Dockerfile.microvm"
      - ".github/workflows/prefect-aws-microvm-docker-images.yaml"
      - ".github/workflows/prefect-aws-microvm-docker-test.yaml"

permissions:
  contents: read

jobs:
  get-versions:
    name: Get Prefect and prefect-aws versions
    runs-on: ubuntu-latest
    outputs:
      PREFECT_VERSION: ${{ steps.get_prefect_version.outputs.PREFECT_VERSION }}
      PREFECT_AWS_VERSION: ${{ steps.get_prefect_aws_version.outputs.PREFECT_AWS_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true

      - name: Get latest Prefect version
        id: get_prefect_version
        run: |
          PREFECT_VERSION=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name')
          echo "PREFECT_VERSION=$PREFECT_VERSION" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get latest prefect-aws version from tags
        id: get_prefect_aws_version
        run: |
          PREFECT_AWS_VERSION=$(git tag --list 'prefect-aws-*' --sort=-version:refname | head -1 | sed 's/^prefect-aws-//')
          if [ -z "$PREFECT_AWS_VERSION" ]; then
            echo "Unable to determine most recent prefect-aws version!"
            exit 1
          fi
          echo "PREFECT_AWS_VERSION=$PREFECT_AWS_VERSION" >> $GITHUB_OUTPUT

  test-build:
    name: Test build prefect-aws MicroVM Docker image
    runs-on: ubuntu-latest
    needs: get-versions

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Test Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src/integrations/prefect-aws
          file: src/integrations/prefect-aws/Dockerfile.microvm
          platforms: linux/arm64
          build-args: |
            PREFECT_VERSION=${{ needs.get-versions.outputs.PREFECT_VERSION }}
            PREFECT_AWS_VERSION=${{ needs.get-versions.outputs.PREFECT_AWS_VERSION }}
          push: false
          pull: true
          tags: prefect-aws-microvm-test:latest
          load: true

      - name: Test prefect-aws version in image
        env:
          EXPECTED_VERSION: ${{ needs.get-versions.outputs.PREFECT_AWS_VERSION }}
        run: |
          INSTALLED_VERSION=$(docker run --rm --platform linux/arm64 prefect-aws-microvm-test:latest python -c "import prefect_aws; print(prefect_aws.__version__)")
          echo "Expected prefect-aws version: $EXPECTED_VERSION"
          echo "Installed prefect-aws version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: Version mismatch!"
            exit 1
          fi
