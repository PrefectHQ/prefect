name: Integration lock automation tests
on:
  pull_request:
    paths:
      - '.github/workflows/*integrati*.yaml'
      - 'scripts/update_uv_lock_integrations.py'
      - 'scripts/tests/test_update_uv_lock_integrations.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --no-project --with packaging --with pyyaml python -m unittest discover -s scripts/tests -p test_update_uv_lock_integrations.py
