name: Image CA trust tests

on:
  pull_request:
    paths:
      - Dockerfile
      - client/Dockerfile
      - scripts/check_image_ca_trust.py
      - scripts/refresh_pip_ca_bundle.py
      - scripts/tests/**
      - .github/workflows/image-ca-trust.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-stores:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python }}
      - run: >-
          uv run --no-project --python ${{ matrix.python }}
          --with certifi==2026.10.19 --with pip==26.2.2
          python -m unittest discover -s scripts/tests -v
