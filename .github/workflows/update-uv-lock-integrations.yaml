# Called only after PyPI publication succeeds; scheduled runs cover missed releases.
name: Update uv.lock integration pins

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases and sweeps so they cannot race over automation branches.
concurrency:
  group: update-uv-lock-integrations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Generate prefect-ci-bot-public token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PREFECT_CI_BOT_PUBLIC_CLIENT_ID }}
          private-key: ${{ secrets.PREFECT_CI_BOT_PUBLIC_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/update_uv_lock_integrations.py pushes its branch with this token
          persist-credentials: true
          ref: main
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest

      - name: Update integration pins and recover or open a PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: uv run --no-project --with packaging scripts/update_uv_lock_integrations.py
