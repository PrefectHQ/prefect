# Keep integration pins in uv.lock up to date with released versions.
#
# The production Dockerfile installs extras with `--constraint` from
# `uv export --frozen --all-extras`, so published images ship whatever
# version of each integration uv.lock pins. Without this, images can lag
# behind (or downgrade vs) the latest released integrations
# (see https://github.com/PrefectHQ/prefect/issues/23524).
#
# Two paths keep the pins current:
#   1. Tag push: fires on the same `prefect-<name>-<semver>` release tags
#      as integration-package-release.yaml and opens a PR bumping just the
#      released package.
#   2. Weekly sweep: upgrades every `prefect-*` package in uv.lock that is
#      behind PyPI and opens one PR — a backstop for anything the
#      tag-triggered path misses (e.g. releases cut before this workflow
#      existed). Also runnable manually via workflow_dispatch.

name: Update uv.lock integration pins

on:
  push:
    tags:
      - "prefect-\\w+-[0-9]+.*"
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  bump-released:
    name: Bump released integration in uv.lock
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # required to push the bump branch
      contents: write
      # required for `gh pr create`
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve package from tag
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_NAME="${TAG%-*}"
          PACKAGE_VERSION="${TAG##*-}"
          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          if grep -q "name = \"${PACKAGE_NAME}\"" uv.lock; then
            echo "in-lock=true" >> "$GITHUB_OUTPUT"
          else
            echo "in-lock=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.package.outputs.in-lock == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest

      - name: Update lock
        if: steps.package.outputs.in-lock == 'true'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: uv lock --upgrade-package "${PACKAGE_NAME}"

      - name: Commit and open pull request
        if: steps.package.outputs.in-lock == 'true'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet uv.lock; then
            echo "uv.lock already pins ${PACKAGE_NAME} to the released version; nothing to do"
            exit 0
          fi

          BRANCH="automation/uv-lock-${PACKAGE_NAME}-${PACKAGE_VERSION}"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null; then
            echo "Branch ${BRANCH} already exists; skipping"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add uv.lock
          git commit -m "Bump ${PACKAGE_NAME} to ${PACKAGE_VERSION} in uv.lock"
          git push --set-upstream origin "${BRANCH}"
          gh pr create \
            --base main \
            --title "Bump ${PACKAGE_NAME} to ${PACKAGE_VERSION} in uv.lock" \
            --body "Docker images install extras constrained to versions pinned in uv.lock (\`uv export --frozen --all-extras\`). This bumps ${PACKAGE_NAME} to ${PACKAGE_VERSION}, released via tag ${TAG}, so published images ship the latest release."

  sweep-stale:
    name: Sweep stale integration pins in uv.lock
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      # required to push the sweep branch
      contents: write
      # required for `gh pr create`
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest

      - name: Upgrade all prefect-* pins
        run: |
          ARGS=()
          while read -r PKG; do
            ARGS+=(--upgrade-package "$PKG")
          done < <(grep -oP '^name = "prefect-[^"]+"' uv.lock | sed 's/name = "//; s/"$//' | sort -u)
          uv lock "${ARGS[@]}"

      - name: Commit and open pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet uv.lock; then
            echo "All prefect-* pins in uv.lock are already current; nothing to do"
            exit 0
          fi

          BRANCH="automation/uv-lock-sweep-$(date +%Y%m%d)"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null; then
            echo "Branch ${BRANCH} already exists; skipping"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add uv.lock
          git commit -m "Sweep stale prefect-* integration pins in uv.lock"
          git push --set-upstream origin "${BRANCH}"
          gh pr create \
            --base main \
            --title "Sweep stale prefect-* integration pins in uv.lock" \
            --body "Docker images install extras constrained to versions pinned in uv.lock (\`uv export --frozen --all-extras\`). This upgrades every prefect-* pin that is behind its latest PyPI release so published images ship current integrations. Generated by the weekly integration-pin sweep."
