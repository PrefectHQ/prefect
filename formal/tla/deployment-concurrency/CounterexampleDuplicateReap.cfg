\* Expected to violate NoForeignRelease when duplicate reapers decrement once each.
SPECIFICATION DuplicateReapSpec

CONSTANTS
    Runs = {r1, r2}
    LeaseIds = {l1, l2}
    Limit = 1
    MaxEpoch = 2
    NoRun = NoRun
    NoLease = NoLease
    RecheckExpiryAtRevoke = FALSE
    FallbackDecrementsAggregate = FALSE
    RequireClaimForDecrement = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    CounterBounds
    ClaimCapacitySafety
    OwnershipConsistent
    NoForeignRelease
    AccountingConsistent
    RenewWinsAgainstStaleScan
