\* Expected to violate NoForeignRelease after nullification detaches a new lease.
SPECIFICATION ReacquireNullificationSpec

CONSTANTS
    Runs = {r1, r2}
    LeaseIds = {l1, l2, l3}
    Limit = 1
    MaxEpoch = 2
    NoRun = NoRun
    NoLease = NoLease
    RecheckExpiryAtRevoke = TRUE
    FallbackDecrementsAggregate = TRUE
    RequireClaimForDecrement = FALSE

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    CounterBounds
    ClaimCapacitySafety
    OwnershipConsistent
    NoForeignRelease
    AccountingConsistent
    RenewWinsAgainstStaleScan
